
<style>
  .ctrl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 1rem 0 1.25rem; }
  .filter-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-sq { width: 22px; height: 3px; border-radius: 2px; }
  .status-msg { font-size: 13px; color: var(--color-text-secondary); padding: 2rem 0; text-align: center; }
</style>

<h2 class="sr-only">MapTap leaderboard ranking progression chart showing who held 1st through 4th place over time</h2>

<div class="ctrl-bar" id="filters"></div>

<div class="legend" id="legend"></div>

<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="rankChart" role="img" aria-label="Line chart showing MapTap player cumulative score progression over time, one line per player"></canvas>
</div>

<div id="statusMsg" class="status-msg">Loading data…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SHEET_ID = '1YOh6ah35-qDKM3p5CnT7jbeyMIY637-WDXF0_xVPKE4';
const SHEET_NAME = 'Sheet1';
const PLAYERS = ['Jura', 'Adam', 'Berta', 'Andrew'];
const COLORS = { Jura: '#378ADD', Adam: '#D85A30', Berta: '#1D9E75', Andrew: '#BA7517' };
const DASH = { Jura: [], Adam: [6,3], Berta: [2,2], Andrew: [8,3,2,3] };

let allRows = [], chartInst = null;

function hasScore(s) { return s !== null && s !== undefined && s !== '' && !isNaN(Number(s)) && Number(s) > 0; }

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < l.length; i++) {
      if (l[i] === '"') { inQ = !inQ; }
      else if (l[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += l[i]; }
    }
    cols.push(cur.trim());
    return cols;
  });
  return lines.slice(1).filter(r => r[0] && r[1]).map(r => ({
    date: r[0], player: r[1],
    final: (r[7] && r[7] !== '') ? Number(r[7]) : null,
  }));
}

function parseDateStr(d) {
  const [dd, mm, yy] = d.split('/').map(Number);
  return new Date(2000 + yy, mm - 1, dd);
}

function filterRows(rows, mode) {
  if (mode === 'all') return rows;
  const dates = [...new Set(rows.map(r => r.date))].sort((a,b) => {
    return parseDateStr(a) - parseDateStr(b);
  });
  if (mode === 'last7') {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
    return rows.filter(r => parseDateStr(r.date) >= cutoff);
  }
  if (mode === 'last30') {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    return rows.filter(r => parseDateStr(r.date) >= cutoff);
  }
  const now = new Date();
  if (mode === 'thisMonth') {
    return rows.filter(r => {
      const d = parseDateStr(r.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  }
  if (mode === 'lastMonth') {
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return rows.filter(r => {
      const d = parseDateStr(r.date);
      return d.getFullYear() === lm.getFullYear() && d.getMonth() === lm.getMonth();
    });
  }
  return rows;
}

function buildChartData(rows) {
  const dates = [...new Set(rows.map(r => r.date))].sort((a,b) => parseDateStr(a) - parseDateStr(b));
  const cumScores = {};
  PLAYERS.forEach(p => { cumScores[p] = 0; });

  const labels = [];
  const ranksByDate = {};

  dates.forEach(date => {
    const dayRows = rows.filter(r => r.date === date);
    dayRows.forEach(r => {
      if (hasScore(r.final)) cumScores[r.player] = (cumScores[r.player] || 0) + Number(r.final);
    });
    const ranked = [...PLAYERS].sort((a,b) => (cumScores[b]||0) - (cumScores[a]||0));
    ranksByDate[date] = {};
    ranked.forEach((p, i) => { ranksByDate[date][p] = cumScores[p] || 0; });
    labels.push(date);
  });

  const datasets = PLAYERS.map(p => ({
    label: p,
    data: labels.map(d => ranksByDate[d][p] || 0),
    borderColor: COLORS[p],
    backgroundColor: COLORS[p] + '22',
    borderWidth: 2,
    borderDash: DASH[p],
    pointRadius: labels.length <= 20 ? 4 : (labels.length <= 50 ? 2 : 0),
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false,
  }));

  return { labels, datasets };
}

function renderChart(mode) {
  const rows = filterRows(allRows, mode);
  const msg = document.getElementById('statusMsg');

  if (!rows.length) {
    msg.textContent = 'No data for this period.';
    msg.style.display = 'block';
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    return;
  }
  msg.style.display = 'none';

  const { labels, datasets } = buildChartData(rows);

  if (chartInst) chartInst.destroy();
  chartInst = new Chart(document.getElementById('rankChart'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => 'Date: ' + ctx[0].label,
            label: ctx => ' ' + ctx.dataset.label + ': ' + Math.round(ctx.parsed.y).toLocaleString() + ' pts',
          },
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
        }
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 45,
            autoSkip: true,
            maxTicksLimit: 12,
            font: { size: 11 },
            color: '#888780',
          },
          grid: { color: 'rgba(136,135,128,0.12)' },
        },
        y: {
          title: { display: true, text: 'Cumulative score', font: { size: 11 }, color: '#888780' },
          ticks: {
            font: { size: 11 },
            color: '#888780',
            callback: v => Math.round(v).toLocaleString(),
          },
          grid: { color: 'rgba(136,135,128,0.12)' },
        }
      }
    }
  });
}

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = PLAYERS.map(p => `
    <span class="legend-item">
      <span class="legend-sq" style="background:${COLORS[p]}"></span>
      ${p}
    </span>`).join('');
}

const MODES = [
  { key: 'all', label: 'All time' },
  { key: 'thisMonth', label: 'This month' },
  { key: 'lastMonth', label: 'Last month' },
  { key: 'last30', label: 'Last 30 days' },
  { key: 'last7', label: 'Last 7 days' },
];

function buildFilters(active) {
  const el = document.getElementById('filters');
  el.innerHTML = MODES.map(m =>
    `<button class="filter-btn${m.key === active ? ' active' : ''}" onclick="switchMode('${m.key}')">${m.label}</button>`
  ).join('');
}

let currentMode = 'all';
function switchMode(mode) {
  currentMode = mode;
  buildFilters(mode);
  renderChart(mode);
}

async function load() {
  const cacheBust = Date.now();
  const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(SHEET_NAME)}&cb=${cacheBust}`;
  const proxies = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  ];
  let lastErr;
  for (const makeProxy of proxies) {
    try {
      const res = await fetch(makeProxy(csvUrl), { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = res.headers.get('content-type')?.includes('json') ? (await res.json()).contents : await res.text();
      if (!text || text.includes('<!DOCTYPE')) throw new Error('Not public');
      allRows = parseCSV(text);
      buildFilters(currentMode);
      buildLegend();
      renderChart(currentMode);
      document.getElementById('statusMsg').style.display = 'none';
      return;
    } catch(e) { lastErr = e; }
  }
  document.getElementById('statusMsg').textContent = 'Could not load data. ' + (lastErr?.message || '');
}

buildFilters(currentMode);
buildLegend();
load();
</script>
